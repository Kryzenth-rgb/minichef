name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparer le dossier www
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          if [ -d img ]; then cp -r img www/; fi

      - name: Installer Capacitor
        run: npm install

      - name: Creer le projet Android
        run: npx cap add android

      - name: Mode paysage
        run: sed -i 's/<activity /<activity android:screenOrientation="landscape" /' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniChef-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
