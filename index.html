<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#287C78">
<title>Mini Chef</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/menu.css">
</head>
<body>
<div id="app">

  <!-- ÉCRAN D'ACCUEIL -->
  <main id="screen-home" class="screen home">
    <div class="h-top">
      <button class="h-profile" data-go="profil">
        <span class="pf-av">👦</span>
        <span><b id="pf-name">Chef</b><small>Niv. <span id="pf-level">1</span></small></span>
      </button>
      <div class="h-right">
        <span class="h-chip">🪙 <b id="home-coins">0</b></span>
        <button class="h-round" data-go="parametres" aria-label="Paramètres">⚙️</button>
      </div>
    </div>

    <div class="h-chef">
      <img src="img/chef.png" alt="" onload="this.nextElementSibling.style.display='none'" onerror="this.remove()">
      <span>👨‍🍳</span>
    </div>

    <div class="h-center">
      <h1 class="h-title">Mini Chef</h1>
      <div class="h-sub">Les Saveurs du Monde</div>
      <div class="h-tag">La passion dans chaque assiette.</div>
      <button id="btn-play" class="h-play">▶ Jouer<small>Niveau 1-1</small></button>
    </div>

    <nav class="h-nav">
      <button class="h-btn" data-go="recettes">📖<span>Recettes</span></button>
      <button class="h-btn" data-go="ameliorations">⭐<span>Améliorations</span></button>
      <button class="h-btn" data-go="carte">🌍<span>Carte</span></button>
      <button class="h-btn" data-go="quetes">📜<span>Quêtes</span></button>
      <button class="h-btn" data-go="boutique">🛒<span>Boutique</span></button>
      <button class="h-btn" data-go="profil">🧑‍🍳<span>Profil</span></button>
    </nav>
  </main>

  <!-- ÉCRAN SECONDAIRE (réutilisé par chaque menu) -->
  <main id="screen-sub" class="screen sub hidden">
    <header class="sub-head">
      <button id="sub-back" class="icon-btn" aria-label="Retour">⬅</button>
      <span id="sub-title"></span>
    </header>
    <div id="sub-body" class="sub-body"></div>
  </main>

  <!-- ÉCRAN DE JEU -->
  <main id="screen-game" class="screen game hidden">

    <header class="topbar">
      <button id="btn-back" class="icon-btn" aria-label="Retour">⬅</button>
      <span>🪙 <b id="coins">0</b></span>
      <span>⭐ <b id="score">0</b></span>
      <span id="combo" class="combo hidden"></span>
      <span>Niv. <b id="level">1</b></span>
    </header>

    <section id="salle" class="salle"></section>

    <section class="cuisine">
      <div class="zone-box bins">
        <div class="st-title">Prépa</div>
        <div class="zone-body">
          <button class="tool" data-ing="pain">🍞<small>Pain</small></button>
          <button class="tool" data-ing="salade">🥬<small>Salade</small></button>
        </div>
      </div>

      <div class="zone-box grills">
        <div class="st-title">Cuisson</div>
        <div class="zone-body">
          <div class="gcol">
            <button class="tool" data-grill="0"><span id="gi0">♨️</span><small id="gl0">Steak</small></button>
            <div class="bar"><div id="m0" class="marker"></div></div>
          </div>
          <div class="gcol">
            <button class="tool" data-grill="1"><span id="gi1">♨️</span><small id="gl1">Steak</small></button>
            <div class="bar"><div id="m1" class="marker"></div></div>
          </div>
        </div>
      </div>

      <div class="zone-box dress">
        <div class="st-title">Dressage</div>
        <div class="zone-body">
          <div id="chef" class="chef">👨‍🍳</div>
          <div id="plate" class="plate"></div>
          <button id="btn-trash" class="tool trash">🗑️<small>Jeter</small></button>
        </div>
      </div>
    </section>

    <section class="auguste">
      <div class="avatar">👴</div>
      <p id="hint"></p>
    </section>

    <div id="toast" class="toast"></div>

    <div id="overlay" class="overlay hidden">
      <div class="card">
        <h2 id="ov-title"></h2>
        <p id="ov-text"></p>
        <div class="row">
          <button id="ov-btn" class="btn"></button>
          <button id="ov-menu" class="btn btn-light">Menu</button>
        </div>
      </div>
    </div>

  </main>

</div>
<script src="js/main.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
