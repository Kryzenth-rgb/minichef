<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#287C78">
<title>Mini Chef</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <main id="screen-title" class="screen">
    <div class="logo">🍳</div>
    <h1>Mini Chef</h1>
    <p class="subtitle">Les Saveurs du Monde</p>
    <p class="resto">Le Petit Gourmet</p>
    <button id="btn-play" class="btn">Jouer</button>
    <p class="credit">SmartLife Apps · Prototype 0.1</p>
  </main>

  <main id="screen-game" class="screen game hidden">

    <header class="topbar">
      <button id="btn-back" class="icon-btn" aria-label="Retour">⬅</button>
      <span>🪙 <b id="coins">0</b></span>
      <span>⭐ <b id="score">0</b></span>
      <span>Niv. <b id="level">1</b></span>
    </header>

    <section class="salle">
      <div class="section-title">Salle · Le Petit Gourmet</div>
      <div class="clients">
        <div class="slot">🪑</div>
        <div class="slot">🪑</div>
        <div class="slot">🪑</div>
      </div>
      <div class="comptoir"></div>
    </section>

    <section class="cuisine">
      <div class="section-title">Cuisine</div>
      <div class="chef-row">
        <div id="chef" class="chef">
          <div id="chef-tool" class="tool"></div>
          <div class="chef-body">👨‍🍳</div>
        </div>
      </div>
      <div class="zones">
        <button class="zone" data-zone="prep"><span class="zi">🥬</span>Prépa</button>
        <button class="zone" data-zone="cuisson"><span class="zi">🍳</span>Cuisson</button>
        <button class="zone" data-zone="froid"><span class="zi">🥤</span>Froid</button>
        <button class="zone" data-zone="dressage"><span class="zi">🍔</span>Dressage</button>
        <button class="zone" data-zone="service"><span class="zi">🛎️</span>Service</button>
      </div>
    </section>

    <section class="auguste">
      <div class="avatar">👴</div>
      <p id="hint"></p>
    </section>

  </main>

</div>
<script src="js/main.js"></script>
</body>
</html>
