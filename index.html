<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#287C78">
<title>Mini Chef</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <main id="screen-title" class="screen">
    <div class="logo">🍳</div>
    <h1>Mini Chef</h1>
    <p class="subtitle">Les Saveurs du Monde</p>
    <p class="resto">Le Petit Gourmet</p>
    <button id="btn-play" class="btn">Jouer</button>
    <p class="credit">SmartLife Apps · Prototype 0.1</p>
  </main>

  <main id="screen-game" class="screen game hidden">

    <header class="topbar">
      <button id="btn-back" class="icon-btn" aria-label="Retour">⬅</button>
      <span>🪙 <b id="coins">0</b></span>
      <span>⭐ <b id="score">0</b></span>
      <span>Niv. <b id="level">1</b></span>
    </header>

    <section class="salle">
      <div id="client" class="client hidden">
        <div id="face" class="face">🙂</div>
        <div class="bubble">
          <div class="order">
            <span>🍔 Hamburger</span>
            <span id="recipe" class="recipe"></span>
          </div>
          <div class="patience"><div id="patience-fill"></div></div>
        </div>
      </div>
      <div id="client-empty" class="client-empty">En attente de clients…</div>
    </section>

    <section class="cuisine">
      <div class="stations">
        <div class="station">
          <div class="st-title">Prépa</div>
          <div class="st-row">
            <button class="tool" data-ing="pain">🍞<small>Pain</small></button>
            <button class="tool" data-ing="salade">🥬<small>Salade</small></button>
          </div>
        </div>
        <div class="station">
          <div class="st-title">Cuisson</div>
          <button id="btn-grill" class="tool wide"><span id="grill-icon">♨️</span><small id="grill-label">Steak</small></button>
          <div class="bar"><div id="grill-marker" class="marker"></div></div>
        </div>
      </div>

      <div class="dressage">
        <div class="st-title">Dressage</div>
        <div class="plate-row">
          <div id="chef" class="chef">👨‍🍳</div>
          <div id="plate" class="plate"></div>
        </div>
      </div>

      <div class="service-row">
        <button id="btn-serve" class="btn btn-small">🛎️ Servir</button>
        <button id="btn-trash" class="btn btn-small btn-light">🗑️ Jeter</button>
        <button class="btn btn-small btn-off" disabled>🥤 Froid</button>
      </div>
    </section>

    <section class="auguste">
      <div class="avatar">👴</div>
      <p id="hint"></p>
    </section>

    <div id="toast" class="toast"></div>

    <div id="overlay" class="overlay hidden">
      <div class="card">
        <h2 id="ov-title"></h2>
        <p id="ov-text"></p>
        <button id="ov-btn" class="btn"></button>
        <button id="ov-menu" class="btn btn-light">Menu</button>
      </div>
    </div>

  </main>

</div>
<script src="js/main.js"></script>
</body>
</html>
